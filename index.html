<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<title>SpendWise</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e7ebf2;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#dc2626;--purple:#7c3aed;--shadow:0 8px 24px rgba(25,39,75,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(80px + env(safe-area-inset-bottom))}
header{padding:18px 4px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font-size:27px;margin:0;letter-spacing:-.5px}.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef3ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.icon{padding:10px;background:#fff;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#64748b;display:block;margin:0 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;color:inherit}
.stat{padding:14px;background:#f8fafc;border:1px solid var(--line);border-radius:14px}.stat .lab{color:var(--muted);font-size:11px;font-weight:800}.stat .val{font-size:21px;font-weight:900;margin-top:4px}
h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.tiny{font-size:12px}
.progress{height:12px;background:#e9edf4;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));width:0}
canvas{max-height:330px}.hidden{display:none}
.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f7;font-weight:800;font-size:11px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bottom-inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bottom button{background:transparent;color:#475569}.bottom button.active{background:#eaf0ff;color:#1d4ed8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#172033;color:#fff;padding:10px 14px;border-radius:12px;display:none;font-size:13px}
@media(min-width:650px){.app{padding-bottom:30px}.bottom{position:static;background:transparent;border:0;padding:0}.bottom-inner{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>SpendWise</h1><div class="sub">Your spending, organized and actionable.</div></div>
<button class="icon" id="installBtn" style="display:none">Install</button>
</header>

<section id="dashboard">
<div class="card">
<h2>Year at a glance</h2>
<div class="grid3">
<div class="stat"><div class="lab">SPENT THIS YEAR</div><div class="val" id="total">€0.00</div></div>
<div class="stat"><div class="lab">AVG / MONTH</div><div class="val" id="avg">€0.00</div></div>
<div class="stat"><div class="lab">TOP CATEGORY</div><div class="val" id="top">—</div></div>
</div>
</div>

<div class="card">
<h2>Savings goal</h2>
<div class="grid2">
<div><label>Year</label><input id="goalYear" type="number" min="2020" max="2100"></div>
<div><label>Target to save (€)</label><input id="saveGoal" type="number" min="0" step="50" placeholder="5000"></div>
</div>
<div style="margin-top:12px" class="tiny muted"><span id="savedSoFar">€0.00</span> saved against target</div>
<div class="progress" style="margin-top:7px"><div class="bar" id="goalBar"></div></div>
<div id="goalAdvice" class="tiny" style="margin-top:9px"></div>
</div>

<div class="card">
<h2>Spending by category</h2>
<canvas id="catChart"></canvas>
</div>

<div class="card">
<h2>Monthly spending</h2>
<canvas id="monthChart"></canvas>
</div>

<div class="card">
<h2>Money-saving coach</h2>
<div id="insights" class="list"></div>
</div>
</section>

<section id="add" class="hidden">
<div class="card">
<h2>Add payment</h2>
<form id="paymentForm">
<div class="grid2">
<div><label>Date</label><input id="date" type="date" required></div>
<div><label>Amount (€)</label><input id="amount" type="number" step="0.01" min="0.01" required placeholder="0.00"></div>
</div>
<div style="margin-top:10px"><label>Category</label><select id="category" required></select></div>
<div style="margin-top:10px"><label>Description</label><input id="description" maxlength="80" placeholder="e.g. fuel station, cinema, groceries"></div>
<div style="margin-top:12px"><button class="primary" type="submit" style="width:100%">Save payment</button></div>
</form>
</div>
<div class="card">
<h2>Categories</h2>
<div class="grid2" id="categoryList"></div>
<div style="margin-top:12px" class="row">
<input id="newCat" placeholder="New category, e.g. Pets">
<button class="secondary" onclick="addCategory()">Add</button>
</div>
</div>
</section>

<section id="payments" class="hidden">
<div class="card">
<div class="row"><div class="grow"><h2 style="margin-bottom:0">Payments</h2></div><button class="danger" onclick="clearAll()">Clear all</button></div>
<div style="margin-top:12px" class="grid2">
<div><label>Filter category</label><select id="filterCat" onchange="renderPayments()"></select></div>
<div><label>Search</label><input id="search" oninput="renderPayments()" placeholder="Description"></div>
</div>
<div id="paymentList" style="margin-top:10px"></div>
</div>
</section>
</div>

<div class="bottom"><div class="bottom-inner">
<button id="navDash" class="active" onclick="showTab('dashboard')">Dashboard</button>
<button id="navAdd" onclick="showTab('add')">+ Add</button>
<button id="navPayments" onclick="showTab('payments')">Payments</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const KEY='spendwise.v1';
const defaultCats=['Oil / Fuel','Entertainment','Food & Groceries','Bills','Shopping','Transport','Health','Travel','Other'];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{payments:[],categories:defaultCats,goalYear:new Date().getFullYear(),saveGoal:5000};
let catChart,monthChart;
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'EUR'}).format(n||0);
const fmtDate=s=>new Date(s+'T00:00:00').toLocaleDateString();
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function setup(){
 document.getElementById('goalYear').value=data.goalYear;
 document.getElementById('saveGoal').value=data.saveGoal;
 document.getElementById('date').value=new Date().toISOString().slice(0,10);
 fillCategorySelects(); renderAll();
}
function fillCategorySelects(){
 const opts=data.categories.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
 document.getElementById('category').innerHTML=opts;
 document.getElementById('filterCat').innerHTML='<option value="">All categories</option>'+opts;
 document.getElementById('categoryList').innerHTML=data.categories.map(c=>`<div class="stat"><div class="lab">CATEGORY</div><div style="font-weight:800">${escapeHtml(c)}</div></div>`).join('');
}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function yearPayments(){return data.payments.filter(p=>p.date.startsWith(String(data.goalYear)))}
function renderAll(){fillCategorySelects();renderDashboard();renderPayments()}
function renderDashboard(){
 const ps=yearPayments(), total=ps.reduce((a,p)=>a+p.amount,0), avg=total/12;
 const by={}; ps.forEach(p=>by[p.category]=(by[p.category]||0)+p.amount);
 const sorted=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 document.getElementById('total').textContent=money(total);
 document.getElementById('avg').textContent=money(avg);
 document.getElementById('top').textContent=sorted[0]?.[0]||'—';
 const goal=Number(data.saveGoal)||0;
 const saved=Math.max(0,goal-total);
 // "saved so far" is presented conservatively as the amount of goal not consumed by spending;
 // users can adjust the goal to fit their income.
 const progress=goal?Math.min(100,Math.max(0,(1-total/goal)*100)):0;
 document.getElementById('savedSoFar').textContent=money(Math.max(0,goal-total));
 document.getElementById('goalBar').style.width=progress+'%';
 const monthsElapsed=(data.goalYear===new Date().getFullYear())?new Date().getMonth()+1:12;
 const remainingMonths=Math.max(1,12-monthsElapsed);
 const needed=Math.max(0,goal-total)/remainingMonths;
 document.getElementById('goalAdvice').textContent=goal?`Aim for about ${money(needed)} of savings per remaining month to reach ${money(goal)} by year end.`:'Set a savings target to get a monthly plan.';
 drawCharts(by); renderInsights(ps,by,total);
}
function drawCharts(by){
 const labels=Object.keys(by), vals=Object.values(by);
 if(catChart)catChart.destroy();
 catChart=new Chart(document.getElementById('catChart'),{type:'doughnut',data:{labels,datasets:[{data:vals}]},options:{plugins:{legend:{position:'bottom'}}}});
 const months=Array.from({length:12},(_,i)=>new Date(2000,i,1).toLocaleString('en',{month:'short'}));
 const valsM=months.map((_,i)=>yearPayments().filter(p=>new Date(p.date+'T00:00:00').getMonth()===i).reduce((a,p)=>a+p.amount,0));
 if(monthChart)monthChart.destroy();
 monthChart=new Chart(document.getElementById('monthChart'),{type:'bar',data:{labels:months,datasets:[{label:'Spent',data:valsM}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}
function renderInsights(ps,by,total){
 const el=document.getElementById('insights'), arr=[];
 if(!ps.length){arr.push('Add your first payment. The coach will then identify your biggest spending categories and trends.')}
 else {
  const [topCat,topAmt]=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  arr.push(`<b>${escapeHtml(topCat)}</b> is your largest category at ${money(topAmt)} this year.`);
  const recent=ps.filter(p=>p.date.slice(0,7)===''+new Date().toISOString().slice(0,7)).reduce((a,p)=>a+p.amount,0);
  const prevKey=new Date(); prevKey.setMonth(prevKey.getMonth()-1); const pk=prevKey.toISOString().slice(0,7);
  const prev=ps.filter(p=>p.date.slice(0,7)===pk).reduce((a,p)=>a+p.amount,0);
  if(prev>0){const d=((recent-prev)/prev)*100;arr.push(`This month is <b>${Math.abs(d).toFixed(0)}% ${d>=0?'higher':'lower'}</b> than last month.`)}
  const discretionary=['Entertainment','Shopping','Travel'];
  const disc=discretionary.reduce((a,c)=>a+(by[c]||0),0);
  if(disc>0)arr.push(`Your discretionary categories total ${money(disc)}. Cutting them by 10% would free about <b>${money(disc*.1)}</b> this year.`);
  const small=ps.filter(p=>p.amount<10).reduce((a,p)=>a+p.amount,0);
  if(small>0)arr.push(`Small purchases under €10 add up to <b>${money(small)}</b>. Review them for easy savings.`);
 }
 el.innerHTML=arr.map(x=>`<div class="insight">${x}</div>`).join('');
}
function renderPayments(){
 const fc=document.getElementById('filterCat').value, q=(document.getElementById('search').value||'').toLowerCase();
 const ps=[...data.payments].sort((a,b)=>b.date.localeCompare(a.date)).filter(p=>(!fc||p.category===fc)&&(!q||p.description.toLowerCase().includes(q)));
 const el=document.getElementById('paymentList');
 if(!ps.length){el.innerHTML='<div class="muted" style="padding:18px 0">No payments match your filters.</div>';return}
 el.innerHTML='<div class="list">'+ps.map(p=>`<div class="item"><div><b>${escapeHtml(p.description||'Payment')}</b><div class="tiny muted">${fmtDate(p.date)} · <span class="pill">${escapeHtml(p.category)}</span></div></div><b>${money(p.amount)}</b><button class="icon" onclick="removePayment('${p.id}')">✕</button></div>`).join('')+'</div>';
}
document.getElementById('paymentForm').addEventListener('submit',e=>{
 e.preventDefault();
 data.payments.push({id:crypto.randomUUID(),date:date.value,amount:Number(amount.value),category:category.value,description:description.value.trim()});
 persist(); e.target.reset(); date.value=new Date().toISOString().slice(0,10); toast('Payment saved'); showTab('dashboard'); renderAll();
});
goalYear.addEventListener('change',()=>{data.goalYear=Number(goalYear.value)||new Date().getFullYear();persist();renderAll()});
saveGoal.addEventListener('change',()=>{data.saveGoal=Math.max(0,Number(saveGoal.value)||0);persist();renderAll()});
function addCategory(){const c=newCat.value.trim();if(!c)return;if(!data.categories.includes(c)){data.categories.push(c);persist();fillCategorySelects();toast('Category added')}newCat.value=''}
function removePayment(id){data.payments=data.payments.filter(p=>p.id!==id);persist();renderAll();toast('Payment removed')}
function clearAll(){if(confirm('Delete every saved payment and start over?')){data.payments=[];persist();renderAll();toast('All payments cleared')}}
function exportData(){
 const rows=[['Date','Amount EUR','Category','Description'],...data.payments.map(p=>[p.date,p.amount,p.category,p.description])];
 const csv=rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='spendwise-payments.csv';a.click();URL.revokeObjectURL(a.href);
}
function showTab(tab){
 ['dashboard','add','payments'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==tab));
 ['navDash','navAdd','navPayments'].forEach(x=>document.getElementById(x).classList.remove('active'));
 document.getElementById(tab==='dashboard'?'navDash':tab==='add'?'navAdd':'navPayments').classList.add('active');
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
setup();
</script>
</body>
</html>
